name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run AlertEngine tests
        run: ./gradlew testDebugUnitTest --tests "com.example.bleproximityalert.alert.AlertEngineTest" 2>&1 || echo "ALERT_ENGINE_FAILED"

      - name: Run DistanceEstimator tests
        run: ./gradlew testDebugUnitTest --tests "com.example.bleproximityalert.util.DistanceEstimatorTest" 2>&1 || echo "DISTANCE_ESTIMATOR_FAILED"

      - name: Run KalmanFilter tests
        run: ./gradlew testDebugUnitTest --tests "com.example.bleproximityalert.util.KalmanFilterTest" 2>&1 || echo "KALMAN_FILTER_FAILED"

      - name: Run TrendAnalyzer tests
        run: ./gradlew testDebugUnitTest --tests "com.example.bleproximityalert.util.TrendAnalyzerTest" 2>&1 || echo "TREND_ANALYZER_FAILED"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
